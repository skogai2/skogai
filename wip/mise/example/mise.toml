# Self-contained example: who and mode are derived from Claude Code's own
# environment, so no mise.<env>.toml files and no MISE_ENV are needed.
# See ../who-and-mode.md.

[tools]
age = "latest"
fnox = "latest"

[env]
# who: CLAUDECODE=1 in everything Claude Code spawns (Bash tool, hooks, MCP servers, IDE terminals)
SKOGAI_USER = "{% if env.CLAUDECODE is defined %}claude{% else %}skogix{% endif %}"
# mode: CLAUDE_CODE_REMOTE is "true" in cloud sessions and never set locally
SKOGAI_MODE = "{% if env.CLAUDE_CODE_REMOTE is defined and env.CLAUDE_CODE_REMOTE == 'true' %}remote{% else %}workstation{% endif %}"

# claude gets only its own profile; the human gets both, stacked
FNOX_PROFILE = "{% if env.CLAUDECODE is defined %}claude{% else %}skogix,claude{% endif %}"
# identity for the shared provider. An injected FNOX_AGE_KEY (remote) overrides it.
FNOX_AGE_KEY_FILE = "{{env.HOME}}/.config/fnox/age.txt"
FNOX_DAEMON = "on"

# no `profile =` here, so mise uses FNOX_PROFILE from above
[secrets.fnox]

[tasks.whoami]
description = "Show who and mode"
run = 'echo "who=$SKOGAI_USER mode=$SKOGAI_MODE profile=$FNOX_PROFILE"'

[tasks.deploy]
description = "A task that receives two shared secrets and nothing else"
secrets = ["MY_TEST_SECRET", "SKOGAI_MY_TEST_SECRET"]
run = 'echo "MY_TEST_SECRET=$MY_TEST_SECRET SKOGAI_MY_TEST_SECRET=$SKOGAI_MY_TEST_SECRET"'

[tasks.claude-only]
description = "Needs a secret that only exists in the claude profile"
secrets = ["CLAUDE_ONLY_SECRET"]
run = 'echo "CLAUDE_ONLY_SECRET=$CLAUDE_ONLY_SECRET"'

[tasks.skogix-only]
description = "Needs a secret that only exists in the skogix profile"
secrets = ["SKOGIX_ONLY_SECRET"]
run = 'echo "SKOGIX_ONLY_SECRET=$SKOGIX_ONLY_SECRET"'
