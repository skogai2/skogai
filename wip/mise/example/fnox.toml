# Two users (claude, skogix) on one machine, plus secrets both can read.
# Identities live outside the repo, in ~/.config/fnox/:
#   age.txt                 the workstation's own key
#   identities/claude.txt   claude's key
#   identities/skogix.txt   skogix's key
# Which profile is active is decided in mise.toml (FNOX_PROFILE).
# After changing any recipients list, run `fnox reencrypt`.
default_provider = "workstation"

# readable by both users and by the workstation key
[providers.workstation]
type = "age"
recipients = [
  "age1jfxe4mpu76pzcucdqqjeg084f47nkx7pl7n9drhes3hef2fjnu6qemnmgx", # claude age
  "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO2Y+NSIO1QDf8KZROEDeiD0M5Z3Yf0ElqozFhqz4tNj claude@skogai-test", # claude ssh
  "age196v9tmje652s6z0s2j6lyl2l8zj0aw509s48kp57hh95y0y4pprqy9hmen", # skogix age
  "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGkqWHf62EuDbO5jzhI8FpP9kmLGTXfckluq/KP47+eo skogix@skogai-test", # skogix ssh
  "age1pu0k76kkj3su0zlrmu2fdkjrxx8jtw86vc4cug9q3me4mfjhkatq66zd4t" # fnox default for workstation itself
]

[providers.claude]
type = "age"
key_file = "~/.config/fnox/identities/claude.txt"
recipients = [
  "age1jfxe4mpu76pzcucdqqjeg084f47nkx7pl7n9drhes3hef2fjnu6qemnmgx",
  "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO2Y+NSIO1QDf8KZROEDeiD0M5Z3Yf0ElqozFhqz4tNj claude@skogai-test",
]

[providers.skogix]
type = "age"
key_file = "~/.config/fnox/identities/skogix.txt"
recipients = [
  "age196v9tmje652s6z0s2j6lyl2l8zj0aw509s48kp57hh95y0y4pprqy9hmen",
  "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGkqWHf62EuDbO5jzhI8FpP9kmLGTXfckluq/KP47+eo skogix@skogai-test",
]

[secrets]
SKOGAI_MY_TEST_SECRET= { provider = "workstation", value = "fnox-age-batch-v1::NSUwEqFVnFUimxMiJWaRdaT45P8/LZCnBg/txgwpO1Hfl9u9l7Da" }
MY_TEST_SECRET= { provider = "workstation", value = "fnox-age-batch-v1::MVFjOqzYqmE5ffG7fWZBXIVEFTxwzAWAh9ABcsjZUSBKjyFW7huwOvIV/Flw" }

[profiles.claude.secrets]
CLAUDE_ONLY_SECRET= { provider = "claude", value = "" }

[profiles.skogix.secrets]
SKOGIX_ONLY_SECRET= { provider = "skogix", value = "" }
