# Entry points for the basic workflows. Each task wraps a bin/ script, so
# env vars (SETUP, MODEL, TOOLS, OUTPUT, KEEP) pass straight through.
#   mise tasks          list them
#   mise run ask "say pong"

[tasks.ask]
description = "One-shot prompt in the sandbox (SETUP=, TOOLS=, MODEL=)"
usage = 'arg "<prompt>" help="Prompt text, sent on stdin"'
run = 'printf "%s\n" "$usage_prompt" | bin/agent'

[tasks.inspect]
description = "Show tools/skills/agents/plugins/MCP and context cost of a setup"
usage = 'arg "[setup]" default="baseline"'
run = 'SETUP="$usage_setup" bin/inspect'

[tasks.transcript]
description = "Path of the latest transcript in a setup's sandbox"
usage = 'arg "[setup]" default="baseline"'
run = 'SETUP="$usage_setup" bin/transcript'

[tasks.eval]
description = "Run all (or selected) cases for a setup"
usage = '''
arg "<setup>"
arg "[cases]" var=#true help="Only these case files"
'''
run = 'bin/eval "$usage_setup" ${usage_cases:-}'

[tasks.review]
description = "Read every response in the latest run"
usage = 'arg "<setup>"'
run = 'bin/review "$usage_setup" | ${PAGER:-less}'

[tasks.compare]
description = "Diff the two newest runs of a setup"
usage = 'arg "<setup>"'
run = 'bin/compare "$usage_setup"'

[tasks.new-setup]
description = "Create an empty setups/<name> (layered on baseline) and cases/<name>"
usage = 'arg "<name>"'
run = '''
set -euo pipefail
[[ -e "setups/$usage_name" ]] && { echo "setups/$usage_name exists" >&2; exit 1; }
mkdir -p "setups/$usage_name"
mkdir -p "cases/$usage_name"
echo "created setups/$usage_name and cases/$usage_name"
'''

[tasks.test]
description = "Run tests/run (must pass before committing)"
run = 'tests/run'

[tasks.orchestrator]
description = "Interactive orchestrator session at the repo root (SETUP=base)"
raw = true
run = 'bin/orchestrator'
