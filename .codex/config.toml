[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
ENABLE_CLAUDEAI_MCP_SERVERS = "false"
CLAUDE_CODE_DISABLE_POLICY_SKILLS = "1"
CLAUDE_CODE_DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL = "1"

[mcp_servers.atuin-mcp]
command = "atuin"
args = ["mcp"]

[mcp_servers.mise]
command = "mise"
args = ["mcp"]
