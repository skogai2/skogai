[tools]
age = "latest"
argc = "latest"
yq = "latest"
fnox = { version = "latest", workflow = "release.yml" }
watchexec = "latest"

[tasks."dash:check"]
description = "agent runs skogai check on a dot (read-only)"
dir = "{{config_root}}/dash-skogai"
usage = 'arg "[dot]" default="src"'
run = '''
claude -p --tools Read,Glob,Grep,Bash \
  --allowedTools "Bash(okn validate *),Bash(git ls-files *),Bash(git rev-parse *),Bash(git status *)" \
  --permission-mode dontAsk \
  "Read workflows/skogai.md and run its check section with <dot> = {{usage.dot}}." < /dev/null
'''
